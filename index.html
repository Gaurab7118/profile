<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaurab Samadder | Portfolio Gateway</title>
  <link rel="icon" type="image/x-icon" href="new profile/favicon.ico">
  <meta http-equiv="refresh" content="0; url='new%20profile/'">
  <script>
    // Immediate redirect to new profile
    window.location.replace("new%20profile/");
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .box {
      max-width: 480px;
      padding: 36px 30px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #fff;
      font-weight: 900;
      font-size: 24px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 0.92rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      padding: 12px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .btn-new {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
    }
    .btn-old {
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo-badge">GS</div>
    <h1>Gaurab Samadder</h1>
    <p>Redirecting to the new systems architecture portfolio...</p>
    <div class="links">
      <a href="new%20profile/" class="btn btn-new">Open New Website →</a>
      <a href="old%20profile/" class="btn btn-old">Open Classic Website (Old Profile)</a>
    </div>
  </div>
</body>
</html>
